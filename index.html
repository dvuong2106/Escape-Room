<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Escape Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        #inventory-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px;
            background: rgba(30, 35, 40, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            z-index: 100;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .inventory-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #ffffff 0%, #a0a5aa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .inventory-title::before,
        .inventory-title::after {
            content: '';
            height: 1px;
            flex: 1;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .inventory-slots {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            overflow-y: auto;
            /* 6 slots visible: 6 * 115px slot + 5 * 12px gap = 750px */
            max-height: calc(6 * 115px + 5 * 12px);
            padding-right: 5px;
            /* For scrollbar */
            padding-bottom: 30px;
        }

        /* Custom Scrollbar for slots */
        .inventory-slots::-webkit-scrollbar {
            width: 6px;
        }

        .inventory-slots::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .inventory-slots::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .inventory-slots::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .slot {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .slot::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .slot:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 2px 10px rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.4);
        }

        .slot:hover::before {
            opacity: 1;
        }

        .slot.selected {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), inset 0 2px 10px rgba(0, 0, 0, 0.3);
            background: rgba(59, 130, 246, 0.2);
        }

        /* Pulse animation for empty slots to make them feel alive */
        @keyframes subtlePulse {
            0% {
                box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            }

            50% {
                box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.05);
            }

            100% {
                box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            }
        }

        .slot:empty {
            animation: subtlePulse 4s infinite ease-in-out;
        }

        /* Item image styling */
        .slot img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.5));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .slot:hover img {
            transform: scale(1.15) rotate(-5deg);
        }

        /* Item icon (emoji/text) styling */
        .slot .item-icon {
            font-size: 40px;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.6));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot:hover .item-icon {
            transform: scale(1.25) rotate(-10deg);
        }

        /* Object Notification */
        #object-notification {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20, 25, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            color: #fff;
            padding: 12px 32px;
            font-size: 18px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            letter-spacing: 1px;
        }

        #object-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== SETTINGS BUTTON ========== */
        #settings-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 35, 40, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: white;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            font-size: 26px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        #settings-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.1) rotate(30deg);
            box-shadow: 0 6px 28px rgba(0,0,0,0.5);
        }

        /* ========== SETTINGS PANEL ========== */
        #settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 99990;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        #settings-overlay.open {
            display: flex;
            opacity: 1;
        }
        #settings-panel {
            background: rgba(20, 26, 32, 0.92);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 28px;
            padding: 40px 48px 44px;
            width: min(400px, 90vw);
            box-shadow: 0 24px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            gap: 28px;
            transform: scale(0.92) translateY(16px);
            transition: transform 0.25s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        #settings-overlay.open #settings-panel {
            transform: scale(1) translateY(0);
        }
        #settings-panel h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            background: linear-gradient(135deg, #fff 0%, #8899aa 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .settings-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
            margin: -8px 0;
        }
        /* Action buttons */
        .settings-action-btn {
            width: 100%;
            padding: 16px 0;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.07);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .settings-action-btn:hover {
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.35);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        #settings-pause-btn  { color: #7dd3fc; border-color: rgba(125,211,252,0.25); }
        #settings-pause-btn:hover  { background: rgba(125,211,252,0.12); border-color: rgba(125,211,252,0.5); }
        #settings-restart-btn { color: #fca5a5; border-color: rgba(252,165,165,0.25); }
        #settings-restart-btn:hover { background: rgba(252,165,165,0.12); border-color: rgba(252,165,165,0.5); }
        /* Volume row */
        .settings-volume-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .settings-volume-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
        }
        #settings-volume-val {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            min-width: 36px;
            text-align: right;
        }
        #settings-volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 99px;
            background: linear-gradient(to right, #7dd3fc var(--pct,50%), rgba(255,255,255,0.15) var(--pct,50%));
            outline: none;
            cursor: pointer;
            transition: height 0.2s;
        }
        #settings-volume-slider:hover { height: 8px; }
        #settings-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.2s;
        }
        #settings-volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
        /* Close button */
        #settings-close-btn {
            align-self: center;
            background: none;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.55);
            border-radius: 99px;
            padding: 8px 28px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #settings-close-btn:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-color: rgba(255,255,255,0.45);
        }

        /* ========== START SCREEN ========== */
        #start-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 1.2s ease;
        }

        #start-screen img.start-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
            object-position: center;
            background: #000;
            pointer-events: none;
        }

        #start-click-zone {
            position: absolute;
            cursor: pointer;
            z-index: 2;
            /* border: 2px solid red; */ /* bật để debug vị trí */
        }
    </style>
</head>

<body>

    <!-- START SCREEN -->
    <div id="start-screen">
        <img class="start-bg" src="/start.png" alt="Start Screen" id="start-bg-img" />
        <div id="start-click-zone"></div>
    </div>

    <div id="object-notification">Tên đồ vật</div>

    <audio id="bgm-audio" src="/nen.mp3" loop preload="auto"></audio>

    <!-- SETTINGS BUTTON -->
    <button id="settings-btn" title="Cài đặt">⚙️</button>

    <!-- SETTINGS OVERLAY PANEL -->
    <div id="settings-overlay">
        <div id="settings-panel">
            <h2>⚙ Cài Đặt</h2>
            <div class="settings-divider"></div>

            <!-- 1. Tạm dừng / Tiếp tục -->
            <button class="settings-action-btn" id="settings-pause-btn">
                <span id="settings-pause-icon">⏸</span>
                <span id="settings-pause-text">Tạm Dừng</span>
            </button>

            <!-- 2. Chơi lại -->
            <button class="settings-action-btn" id="settings-restart-btn">
                ↺ Chơi Lại
            </button>

            <div class="settings-divider"></div>

            <!-- 3. Âm lượng -->
            <div class="settings-volume-row">
                <div class="settings-volume-label">
                    <span>🔊 Âm Lượng</span>
                    <span id="settings-volume-val">50</span>
                </div>
                <input type="range" id="settings-volume-slider" min="0" max="100" value="50" />
            </div>

            <div class="settings-divider"></div>
            <button id="settings-close-btn">Đóng</button>
        </div>
    </div>
    <div id="inventory-container">
        <div class="inventory-title">Items</div>
        <div class="inventory-slots" id="inventory-slots">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
    </div>

    <!-- LAPTOP HTML UI OVERLAY -->
    <div id="laptop-ui"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; font-family: Inter, sans-serif;">
        <div
            style="color: #ccc; font-size: 16px; margin-bottom: 20px; font-family: Inter, sans-serif; pointer-events: none;">
            (Nhả chuột bất kỳ đâu để đóng)</div>

        <!-- Image Display when unlocked -->
        <img id="laptop-unlocked-img" src="/models/arrange_book.png"
            style="display: none; max-width: 90%; max-height: 80%; object-fit: contain; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border-radius: 4px;" />

        <!-- Keypad UI -->
        <div id="laptop-keypad-container"
            style="background: #1e1e24; padding: 40px; border-radius: 12px; display: flex; flex-direction: column; align-items: center;">
            <div id="laptop-message"
                style="color: #fff; font-size: 40px; font-weight: bold; margin-bottom: 30px; text-transform: uppercase;">
                ENTER PASSWORD</div>

            <div style="display: flex; gap: 15px; margin-bottom: 40px; width: 100%;">
                <input type="text" id="laptop-input" readonly
                    style="flex: 1; height: 70px; font-size: 40px; font-family: 'Courier New', monospace; padding: 0 20px; border: none; outline: none; border-radius: 8px;" />
                <button id="laptop-submit"
                    style="width: 90px; font-size: 40px; font-weight: bold; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer;">→</button>
            </div>

            <div style="display: grid; grid-template-columns: repeat(5, 100px); gap: 20px;">
                <button class="keypad-btn" data-value="0"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">0</button>
                <button class="keypad-btn" data-value="1"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">1</button>
                <button class="keypad-btn" data-value="2"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">2</button>
                <button class="keypad-btn" data-value="3"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">3</button>
                <button class="keypad-btn" data-value="4"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">4</button>
                <button class="keypad-btn" data-value="5"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">5</button>
                <button class="keypad-btn" data-value="6"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">6</button>
                <button class="keypad-btn" data-value="7"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">7</button>
                <button class="keypad-btn" data-value="8"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">8</button>
                <button class="keypad-btn" data-value="9"
                    style="height: 90px; font-size: 40px; font-weight: bold; background: #333; color: white; border: 4px solid #555; border-radius: 8px; cursor: pointer;">9</button>
            </div>
        </div>
    </div>

    <script type="module" src="/main.js"></script>
</body>

</html>
